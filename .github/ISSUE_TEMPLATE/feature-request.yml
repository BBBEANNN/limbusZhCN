# 收集对汉化器功能、兼容策略、诊断流程和文档的改进建议。
name: 功能建议
description: 提议新的功能、工作流或体验改进
title: "[建议] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请重点说明实际使用场景和希望解决的问题，不必预先设计完整技术实现。

  - type: dropdown
    id: area
    attributes:
      label: 建议领域
      options:
        - 汉化内容或字体显示
        - 游戏启动与设备兼容
        - Google、Apple 或游客登录
        - 汉化包下载、安装或更新
        - 诊断与问题反馈
        - 界面与操作体验
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景和现有问题
      description: 请说明在什么情况下遇到什么不便，以及当前做法为什么不足。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望汉化器提供的行为或结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 如果尝试过其他办法，请说明其效果和限制。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充资料
      description: 可附截图、示意图或相关链接，请勿上传游戏本体或受版权保护的完整资源。
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
        - label: 该建议不要求仓库分发游戏本体、账号凭据或未经授权的完整资源。
          required: true
